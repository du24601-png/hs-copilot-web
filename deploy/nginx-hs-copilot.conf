server {
    listen 80;
    # 没有域名就填服务器公网 IP
    server_name 你的域名或IP;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:7100;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 本模板只有一层代理：覆盖客户端伪造的转发头，供应用按 IP 限流。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 关键：大模型一次调用可能要几十秒。
        # Nginx 默认 60s 就掐断，会表现为"点了没反应"。
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;

        # 关掉缓冲，让流式/长响应更稳
        proxy_buffering off;
    }

    # 健康检查不记日志，方便拨测
    location = /api/health {
        proxy_pass http://127.0.0.1:7100;
        access_log off;
    }

    access_log /var/log/nginx/hs-copilot.access.log;
    error_log  /var/log/nginx/hs-copilot.error.log;
}
